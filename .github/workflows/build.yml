name: Build and test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RustCompanion.slnx

      - name: Test
        run: dotnet test tests/RustCompanion.Tests/RustCompanion.Tests.csproj -c Release --no-restore

      - name: Build WPF application
        run: dotnet build src/RustCompanion.App/RustCompanion.App.csproj -c Release --no-restore
